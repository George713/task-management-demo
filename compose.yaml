# One-command route (D14): `docker compose up --build` starts Postgres and the app.
# Plain-Java route: `docker compose up db`, then build and run the JAR locally;
# its default prod settings point to this Postgres on localhost:5432.
# Fixed project name, so containers and the data volume get the same names
# whatever the checkout directory is called.
name: task-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/tasks
      QUARKUS_DATASOURCE_USERNAME: tasks
      QUARKUS_DATASOURCE_PASSWORD: tasks
    ports:
      - "8080:8080"

volumes:
  db-data:
