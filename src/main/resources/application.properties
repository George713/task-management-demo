quarkus.datasource.db-kind=postgresql

# Schema is owned by Flyway (D6): migrations run at startup, Hibernate only
# validates its mapping against the real tables and fails fast on mismatch.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Connection settings for the packaged app (prod profile only), so Dev Services
# still start Postgres automatically in dev and test mode. Override them with
# the QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD environment variables.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tasks
%prod.quarkus.datasource.username=tasks
%prod.quarkus.datasource.password=tasks

# Request objects contain only the fields a client may send. Anything else
# (e.g. "created" or "priority" where they are not allowed) is a 400, not
# silently ignored (D12). Quarkus' default is to ignore unknown fields.
quarkus.jackson.fail-on-unknown-properties=true
